name: Offline regression tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    env:
      SMARTSEHAT_OFFLINE: "1"
      SMARTSEHAT_MODE: stub
      DOTENV_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python test_flow.py
      - run: python test_dawa.py
      - run: python -m compileall -q smartsehat tests test_flow.py test_dawa.py test_real.py test_qwen_asr.py demo_medication_review.py
      - run: python demo_medication_review.py
