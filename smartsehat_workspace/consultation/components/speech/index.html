<!doctype html><html lang="ur"><meta charset="utf-8"><style>body{font:17px system-ui;margin:8px}button{font:inherit;padding:12px;margin:5px;border-radius:8px;border:1px solid #087d82}textarea{width:96%;height:100px;font:18px system-ui}p{color:#38535a}</style>
<button id="mic">🎙 Speak / بولیں</button><button id="stop">Stop</button><button id="speak">🔊 Read back</button><select id="voice" aria-label="Available matching voices"></select><p id="status" role="status"></p><textarea id="text" aria-label="Voice transcript"></textarea><button id="use">Use this transcript</button>
<script>
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');let args={},recognition,scope='',voices=[];
const $=x=>document.getElementById(x);
function refreshVoices(){voices=(window.speechSynthesis?.getVoices()||[]).filter(v=>v.lang.split('-')[0]===(args.language||'ur-PK').split('-')[0]);$('voice').replaceChildren();for(const [i,v]of voices.entries()){const option=document.createElement('option');option.value=i;option.textContent=v.name+(v.localService?' · on device':' · may use network');$('voice').append(option);}$('speak').disabled=!voices.length;if(!voices.length)$('status').textContent='No matching installed voice. Use the supplied recording or read aloud; another language will not be substituted.';}
window.addEventListener('message',e=>{if(e.data.type==='streamlit:render'){const next=e.data.args;const nextScope=(next.case_id||'')+':'+(next.language||'')+':'+(next.readback||'');if(nextScope!==scope){recognition?.abort();window.speechSynthesis?.cancel();scope=nextScope;$('text').value=next.readback||'';}args=next;$('text').dir=/^(ur|sd|pa|ps|skr|bal)/.test(args.language||'')?'rtl':'ltr';$('text').readOnly=!!args.read_only;$('mic').hidden=!!args.read_only;$('use').hidden=!!args.read_only;refreshVoices();}});
if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=refreshVoices;
$('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('status').textContent='Browser speech unavailable. Use the typed text or audio recorder below.';return;}try{recognition=new R();recognition.lang=args.language||'ur-PK';recognition.continuous=true;recognition.interimResults=false;recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)$('text').value+=' '+e.results[i][0].transcript;};recognition.onerror=e=>$('status').textContent=e.error+' — use typed text or audio recording.';recognition.start();$('status').textContent='Listening. Browser speech may require internet.';}catch(e){$('status').textContent='Microphone unavailable. Use typed text.';}};
$('stop').onclick=()=>{recognition?.stop();window.speechSynthesis?.cancel();$('status').textContent='Stopped';};
$('speak').onclick=()=>{if(!window.speechSynthesis||!voices.length)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(args.readback||$('text').value);u.lang=args.language||'ur-PK';u.voice=voices[Number($('voice').value)||0];window.speechSynthesis.speak(u);$('status').textContent='Check the spoken wording against the text. Device voices are not clinically validated.';};
$('use').onclick=()=>send('streamlit:setComponentValue',{value:$('text').value});send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:285});
</script></html>
